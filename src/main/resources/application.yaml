server:
  port: 8082

spring:
  application:
    name: webtrak-admin
  datasource:
    url: jdbc:postgresql://localhost:5432/webtrak_admin
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

auth:
  service:
    url: http://localhost:8081

jwt:
  secret: mySuperLongSecretKeyForJWT1234567890
  expiration: 86400000
